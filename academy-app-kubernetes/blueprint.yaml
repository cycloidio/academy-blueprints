# A service made from the academy-app template, on Kubernetes (M1, M2): deploys the Helm chart its
# CI publishes to the GitHub Packages of its own organisation, on the Academy cluster (C3), with
# the kubeconfig credential of that cluster.
#
# Chart: oci://ghcr.io/<owner>/charts/<repository>:0.1.0-g<commit>, from the repository the person
# names; that version deploys the image of the same commit.
# The packages must be public: the helm step cannot log in to a private registry yet (G15).
# The app answers on http://<release>-<environment>.<cluster IP>.sslip.io/ (decision D5).
#
# Until Cycloid answers how an app Blueprint reads another Resource's property, the person copies
# the cluster's "App hostname suffix" into the form. The helm step reports no address, so a small
# shell step returns it as a Resource property.
# The helm step runs `upgrade` without `--install`: "Deploy" installs, "Update" upgrades.

# An app runs in an Environment (`dev`, then `prod` by promotion): its name is part of the address.
id: academy-app
name: Academy App (Kubernetes)
description: A service made from the academy-app template, deployed with Helm on the Academy cluster.

environment_scope: required

credentials:
  - id: cluster
    type: kubeconfig
    description: Access to the cycloid-academy namespace of the Academy cluster

# The app depends on the Academy cluster it runs on. Cycloid gives the team that owns the app
# read-only access to that cluster through this link (cycloid specs 02/11 §5.10), and a step
# looks for a credential (the kubeconfig) on the linked cluster after the app's own Resource.
relations:
  - type: depends_on
    direction: outgoing
    cardinality: one
    target_blueprint_types: [academy-cluster]

property_schema:
  - { id: url, name: App address, type: string, display: catalog }
  - { id: app_ref, name: Commit deployed, type: string, display: catalog, promotes_as: app_ref }

actions:
  - id: deploy
    name: Deploy
    trigger: manual
    workflow: deploy
    form:
      content:
        - id: repository
          type: { string: { pattern: '^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9._-]*$' } }
          name: GitHub repository
          description: owner/name of the service's repository, in lowercase, for example cycloidio/academy-app.
          required: true
        - id: commit
          type: { string: { pattern: '^[0-9a-f]{40}$' } }
          name: Commit to deploy
          description: The full commit SHA of academy-app whose CI run is green (the head of master for a first deploy).
          required: true
        - id: hostname_suffix
          type: { string: { pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}\.sslip\.io$' } }
          name: Cluster hostname suffix
          description: Copy "App hostname suffix" from your Academy cluster, for example 203.0.113.10.sslip.io.
          required: true
        - id: message
          type: string
          name: Message
          description: The title of the page.
          default: Hello from Cycloid Academy
  - id: update
    name: Update
    trigger: manual
    workflow: update
    form:
      content:
        - id: repository
          type: { string: { pattern: '^[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9._-]*$' } }
          name: GitHub repository
          description: owner/name of the service's repository, in lowercase, for example cycloidio/academy-app.
          required: true
        - id: commit
          type: { string: { pattern: '^[0-9a-f]{40}$' } }
          name: Commit to deploy
          description: The full commit SHA of academy-app whose CI run is green (the head of master for a first deploy).
          required: true
        - id: hostname_suffix
          type: { string: { pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}\.sslip\.io$' } }
          name: Cluster hostname suffix
          description: Copy "App hostname suffix" from your Academy cluster, for example 203.0.113.10.sslip.io.
          required: true
        - id: message
          type: string
          name: Message
          description: The title of the page.
          default: Hello from Cycloid Academy
  - id: destroy
    name: Remove
    trigger: manual
    workflow: destroy

workflows:
  deploy:
    steps:
      - id: helm
        type: helm
        timeout: 300
        params:
          command: install
          release: !jq '.resource.slug'
          namespace: cycloid-academy
          chart: !jq '"oci://ghcr.io/" + (.fields.repository.value | split("/")[0]) + "/charts/" + (.fields.repository.value | split("/")[1]) + ":0.1.0-g" + .fields.commit.value'
          values:
            ingress.host: !jq '.resource.slug + "-" + (.environment.slug // "none") + "." + .fields.hostname_suffix.value'
            environment: !jq '.environment.slug // "none"'
            message: !jq '.fields.message.value'
      - id: address
        type: shell
        depends_on: [helm]
        outputs: [url, app_ref]
        params:
          image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          script: !jq '"set -eu\necho \"url=http://" + .resource.slug + "-" + (.environment.slug // "none") + "." + .fields.hostname_suffix.value + "/\" >> \"$CYCLOID_OUTPUT\"\necho \"app_ref=" + .fields.commit.value + "\" >> \"$CYCLOID_OUTPUT\""'
  update:
    steps:
      - id: helm
        type: helm
        timeout: 300
        params:
          command: upgrade
          release: !jq '.resource.slug'
          namespace: cycloid-academy
          chart: !jq '"oci://ghcr.io/" + (.fields.repository.value | split("/")[0]) + "/charts/" + (.fields.repository.value | split("/")[1]) + ":0.1.0-g" + .fields.commit.value'
          values:
            ingress.host: !jq '.resource.slug + "-" + (.environment.slug // "none") + "." + .fields.hostname_suffix.value'
            environment: !jq '.environment.slug // "none"'
            message: !jq '.fields.message.value'
      - id: address
        type: shell
        depends_on: [helm]
        outputs: [url, app_ref]
        params:
          image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          script: !jq '"set -eu\necho \"url=http://" + .resource.slug + "-" + (.environment.slug // "none") + "." + .fields.hostname_suffix.value + "/\" >> \"$CYCLOID_OUTPUT\"\necho \"app_ref=" + .fields.commit.value + "\" >> \"$CYCLOID_OUTPUT\""'
  destroy:
    steps:
      - id: helm
        type: helm
        params:
          command: uninstall
          release: !jq '.resource.slug'
          namespace: cycloid-academy
